[package]
name = "parquet_mcp_server"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
datafusion = "55.0.0"
rmcp = { version = "3.3.0", features = ["server", "transport-streamable-http-server"] }
schemars = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["macros", "net", "rt-multi-thread", "signal", "sync"] }
chrono = "0.4"
